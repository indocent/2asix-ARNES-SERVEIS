<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benvingut a __DOMAIN__</title>
<style>
  :root {
    --primary: #1a73e8;
    --bg: #f6f8fa;
    --text: #202124;
    --muted: #5f6368;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  main {
    max-width: 32rem;
    width: 100%;
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 12px;
    padding: 2.5rem;
    text-align: center;
    box-shadow: 0 1px 3px rgba(60, 64, 67, .15);
  }
  .badge {
    display: inline-block;
    padding: .25rem .75rem;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--primary);
    background: rgba(26, 115, 232, .1);
    border-radius: 999px;
    margin-bottom: 1.25rem;
  }
  h1 { font-size: 1.75rem; margin-bottom: .75rem; }
  p { color: var(--muted); line-height: 1.6; margin-bottom: 1rem; }
  code {
    font-family: ui-monospace, "Cascadia Mono", "Liberation Mono", monospace;
    background: #f1f3f4;
    border-radius: 6px;
    padding: .1rem .4rem;
  }
</style>
</head>
<body>
<main>
  <span class="badge">Arnes web hosting</span>
  <h1>Benvingut/da!</h1>
  <p>Aquest lloc web pertany al client <strong>__CLIENT__</strong> i s'ha
     creat correctament. Encara no té contingut publicat.</p>
  <p>Puja els teus fitxers per FTP al directori <code>htdocs</code> i
     reemplaça aquesta pàgina d'avís quan estiguis a punt.</p>
</main>
</body>
</html>
